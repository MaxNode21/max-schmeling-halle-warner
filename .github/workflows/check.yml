name: Parkplatz Checker

on:
  schedule:
    # Täglich 07:47 Uhr Berliner Zeit, im Sommer wie im Winter.
    # Bewusst nicht zur vollen Stunde: Dann ist GitHub stark ausgelastet
    # und startet geplante Läufe oft verspätet.
    - cron: '47 7 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll passieren?'
        type: choice
        options:
          - normal
          - testnachricht
          - trockenlauf
        default: normal
      datum:
        description: 'Anderes Datum prüfen (JJJJ-MM-TT), leer = heute'
        type: string
        required: false

permissions:
  contents: read

jobs:
  run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python installieren
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Skript ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Eingaben nur über Umgebungsvariablen weiterreichen und nie direkt
          # in den Befehl einsetzen (Schutz vor Script-Injection).
          MODUS: ${{ inputs.modus }}
          DATUM: ${{ inputs.datum }}
        run: |
          args=()
          case "$MODUS" in
            testnachricht) args+=(--test) ;;
            trockenlauf) args+=(--dry-run) ;;
          esac
          if [ -n "$DATUM" ]; then
            args+=(--datum "$DATUM")
          fi
          python main.py "${args[@]}"
